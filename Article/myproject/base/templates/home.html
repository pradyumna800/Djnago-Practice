{% extends 'main.html' %}

{% block content %}

<center>
    <h1>this is base home page</h1>
    <!-- {{data}} -->
    {% for i in data %}
    <h2>{{i.id}}</h2>
    <h2>{{i.title}}</h2>
    <h2>{{i.desc|truncatewords:6}}</h2>
    <button style="background-color: rgb(20, 84, 167); height: 30px; width: 90px; border-radius: 6px;"><a href="{% url 'read' i.id %}" style="text-decoration: none; color: white;">Read More</a></button>
    {% endfor %}
</center>
{% endblock %}
